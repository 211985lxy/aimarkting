<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#34d399"/>
    </marker>
    <linearGradient id="headline" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #94a3b8; }
      .panel-title { font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .panel-note { font-size: 15px; font-weight: 500; fill: #cbd5e1; }
      .label { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .desc { font-size: 15px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 13px; font-weight: 500; fill: #94a3b8; }
      .gold { fill: #fbbf24; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.8"/>
  <rect x="0" y="0" width="1600" height="900" fill="#020617" opacity="0.28"/>

  <text x="70" y="84" class="title">WorkBuddy 底层逻辑：从“问答”到“交付”</text>
  <text x="72" y="120" class="subtitle">它不是更会聊天的机器人，而是能接任务、拆步骤、调工具、交结果的桌面端 AI Agent。</text>

  <rect x="70" y="165" width="690" height="570" rx="18" fill="#0f172a"/>
  <rect x="70" y="165" width="690" height="570" rx="18" fill="rgba(30,41,59,0.58)" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="225" class="panel-title">ChatBot</text>
  <text x="115" y="258" class="panel-note">目标：回答一个问题，输出一段文本</text>

  <rect x="150" y="345" width="150" height="90" rx="12" fill="#0f172a"/>
  <rect x="150" y="345" width="150" height="90" rx="12" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="2"/>
  <text x="225" y="384" class="label" text-anchor="middle">用户提问</text>
  <text x="225" y="412" class="desc" text-anchor="middle">一句问题</text>

  <line x1="316" y1="390" x2="398" y2="390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="415" y="345" width="150" height="90" rx="12" fill="#0f172a"/>
  <rect x="415" y="345" width="150" height="90" rx="12" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="2"/>
  <text x="490" y="384" class="label" text-anchor="middle">模型回复</text>
  <text x="490" y="412" class="desc" text-anchor="middle">文本生成</text>

  <line x1="581" y1="390" x2="663" y2="390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="680" y="345" width="0" height="90" rx="12" fill="#0f172a"/>
  <rect x="115" y="525" width="590" height="105" rx="14" fill="#020617"/>
  <rect x="115" y="525" width="590" height="105" rx="14" fill="rgba(30,41,59,0.72)" stroke="#475569" stroke-width="1.5"/>
  <text x="410" y="568" class="label" text-anchor="middle">典型结果</text>
  <text x="410" y="604" class="desc" text-anchor="middle">一段解释、一份建议、一个答案</text>

  <rect x="840" y="165" width="690" height="570" rx="18" fill="#0f172a"/>
  <rect x="840" y="165" width="690" height="570" rx="18" fill="rgba(6,78,59,0.34)" stroke="#34d399" stroke-width="2"/>
  <text x="885" y="225" class="panel-title">Desktop AI Agent</text>
  <text x="885" y="258" class="panel-note">目标：接收任务，执行流程，交付结果</text>

  <rect x="915" y="325" width="145" height="78" rx="12" fill="#0f172a"/>
  <rect x="915" y="325" width="145" height="78" rx="12" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="2"/>
  <text x="987" y="358" class="label" text-anchor="middle">接任务</text>
  <text x="987" y="384" class="desc" text-anchor="middle">明确目标</text>

  <line x1="1075" y1="364" x2="1127" y2="364" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)"/>

  <rect x="1145" y="325" width="145" height="78" rx="12" fill="#0f172a"/>
  <rect x="1145" y="325" width="145" height="78" rx="12" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="2"/>
  <text x="1217" y="358" class="label" text-anchor="middle">拆步骤</text>
  <text x="1217" y="384" class="desc" text-anchor="middle">规划路径</text>

  <line x1="1217" y1="419" x2="1217" y2="475" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)"/>

  <rect x="1145" y="492" width="145" height="78" rx="12" fill="#0f172a"/>
  <rect x="1145" y="492" width="145" height="78" rx="12" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="2"/>
  <text x="1217" y="525" class="label" text-anchor="middle">调工具</text>
  <text x="1217" y="551" class="desc" text-anchor="middle">读写执行</text>

  <line x1="1130" y1="531" x2="1078" y2="531" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)"/>

  <rect x="915" y="492" width="145" height="78" rx="12" fill="#0f172a"/>
  <rect x="915" y="492" width="145" height="78" rx="12" fill="rgba(6,78,59,0.48)" stroke="#34d399" stroke-width="2"/>
  <text x="987" y="525" class="label" text-anchor="middle">交结果</text>
  <text x="987" y="551" class="desc" text-anchor="middle">文件/报告</text>

  <rect x="1340" y="326" width="130" height="244" rx="14" fill="#020617"/>
  <rect x="1340" y="326" width="130" height="244" rx="14" fill="rgba(59,130,246,0.22)" stroke="#60a5fa" stroke-width="1.7" stroke-dasharray="8 5"/>
  <text x="1405" y="367" class="label" text-anchor="middle">Skill</text>
  <text x="1405" y="401" class="desc" text-anchor="middle">固化 SOP</text>
  <text x="1405" y="432" class="tiny" text-anchor="middle">报告</text>
  <text x="1405" y="462" class="tiny" text-anchor="middle">表格</text>
  <text x="1405" y="492" class="tiny" text-anchor="middle">PPT</text>
  <text x="1405" y="522" class="tiny" text-anchor="middle">网页</text>

  <path d="M 1320 364 C 1350 364, 1340 364, 1340 364" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 1320 531 C 1350 531, 1340 531, 1340 531" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <rect x="885" y="620" width="585" height="58" rx="12" fill="#020617"/>
  <rect x="885" y="620" width="585" height="58" rx="12" fill="rgba(6,78,59,0.28)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1178" y="656" class="desc" text-anchor="middle">生成 Word 报告 / 整理 Excel / 分析文件夹 / 制作网页 / 定时处理新增资料</text>

  <rect x="305" y="787" width="990" height="70" rx="18" fill="#020617"/>
  <rect x="305" y="787" width="990" height="70" rx="18" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="2"/>
  <text x="800" y="832" class="gold" font-size="28" text-anchor="middle">ChatBot 解决“问答”，Agent 解决“交付”。</text>
</svg>
