name: Build & Deploy

on:
  push:
    branches: [main]

env:
  ACR_PUBLIC: clip-registry.cn-hangzhou.cr.aliyuncs.com
  ACR_VPC: clip-registry-vpc.cn-hangzhou.cr.aliyuncs.com
  ACR_NAMESPACE: clipflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR (public endpoint)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_PUBLIC }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: web-runner
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/web:latest
            ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/web:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: worker-runner
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/worker:latest
            ${{ env.ACR_PUBLIC }}/${{ env.ACR_NAMESPACE }}/worker:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to K8s
        run: |
          kubectl set image deployment/clipflow-web web=${{ env.ACR_VPC }}/${{ env.ACR_NAMESPACE }}/web:${{ github.sha }}
          kubectl set image deployment/clipflow-worker worker=${{ env.ACR_VPC }}/${{ env.ACR_NAMESPACE }}/worker:${{ github.sha }}
          kubectl rollout status deployment/clipflow-web --timeout=180s
          kubectl rollout status deployment/clipflow-worker --timeout=180s
